<div class="card<#if fullHeight> h-100</#if>"<#if locator??> id="${locator}"</#if><#if ariaLabel??> role="region" aria-label="${ariaLabel}"</#if>>
<#if header??>
	<div class="card-header">${header}</div>
</#if>
	<div class="card-body">
<#if image??>
		${image}
</#if>
<#if featuredTitle??>
		<div class="card-title h5">${featuredTitle}</div>
</#if>
<#if title??>
		<h4 class="card-title">${title}</h4>
</#if>
<#if subTitle??>
		<h6 class="card-subtitle mb-2 text-muted">${subTitle}</h6>
</#if>
		<div class="card-inner-body<#if adjust> width-max-content</#if>">${content}</div>
	</div>
<#if footer??>
	<div class="card-footer">${footer}</div>
</#if>
</div>
