<nav id="navbarContent" class="navbar navbar-content">
	<ul class="nav nav-pills page-navigation flex-nowrap flex-row">
		<#list entries as entry>
		<#if entry.dropdown>
		<li class="nav-item dropdown"><a class="nav-link dropdown-toggle"
			href="#" role="button" data-bs-toggle="dropdown"
			aria-expanded="false">${entry.text}</a>
			<ul class="dropdown-menu">
				<#list entry.items as item>
				<li><a class="dropdown-item" href="${item.link}"
					target="_self">${item.text}</a></li>
				</#list>
			</ul></li>
		<#else>
		<li class="nav-item"><a class="nav-link" href="${entry.link}"
			target="_self">${entry.text}</a></li>
		</#if>
		</#list>
	</ul>
</nav>
